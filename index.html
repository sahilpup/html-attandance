<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Meal Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🍽️ Daily Meal Tracker</h1>
    <p>Track your <strong>breakfast</strong> and <strong>dinner</strong> attendance each day.</p>

    <div class="controls">
      <input type="text" id="userName" placeholder="Enter your name" />
      <input type="month" id="monthPicker" />
      <button id="loadData">Load</button>
    </div>

    <div id="summary" class="summary"></div>

    <table id="mealTable">
      <!-- Table will be generated by JavaScript -->
    </table>

    <div class="buttons">
      <button id="markBreakfast">Mark Breakfast</button>
      <button id="markDinner">Mark Dinner</button>
      <button id="exportCsv">Export CSV</button>
      <button id="clearData">Clear Data</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
